<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form>
        <fieldset>
            <legend>Login Page</legend>
            <label>Name:</label>
            <input type="text" placeholder="Enter your name">

            <label>Number:</label>
            <input type="number" placeholder="Enter your number">
            <br>

            <input type="checkbox">


            <input type="radio">

            <textarea placeholder="Leave a message" rows="5" cols="40"></textarea>

            <select>
                <option>Eng</option>
                <option>UR</option>
                <option>AR</option>
            </select>

            <button>Submit</button>
            <button type="reset">Reset</button>
        </fieldset>
    </form>
</body>

</html>
